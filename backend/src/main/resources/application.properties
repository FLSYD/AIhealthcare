spring.application.name=ai-healthcare

#数据源配置 springboot默认使用连接池是Hikari (日本一款连接池)
#连接数据库的四大元素
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aihealthcare_local?characterEncoding=UTF-8&serverTimezone=Asia/Hong_Kong
spring.datasource.username=aihealthcare_app
spring.datasource.password=${LOCAL_DB_PASSWORD:}

#分页插件配置
#配置方言
pagehelper.helper-dialect=MySQL
pagehelper.reasonable=true

# 禁止将小数主键截断成整数，避免修改到其它用户。
spring.jackson.deserialization.accept-float-as-int=false

#mybatis配置,别名包配置
mybatis-plus.type-aliases-package=com.aaa.aihealthcare.entity
mybatis-plus.mapper-locations=classpath:mapper/*.xml

#控制台日志输出配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# Redis连接配置
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.database=0
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# 本副本仅使用根目录的独立本地凭据，不加载原项目配置。
spring.data.redis.password=${LOCAL_REDIS_PASSWORD:}
spring.config.import=optional:file:../.local/backend.properties,optional:file:../.local/wechat.properties,optional:file:../.local/wechat-pay.properties
server.address=127.0.0.1
server.port=18080
spring.sql.init.mode=never
